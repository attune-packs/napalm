ref: napalm.rollback
label: "Rollback Configuration (Mutating)"
description: "Invoke the driver's rollback behavior after explicit confirmation; exact rollback depth is driver-specific"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: napalm_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, description: "Pack-owned Attune Key containing the device profile", default: "napalm.credentials", required: true}
  confirm: {type: boolean, description: "Explicitly authorize rollback", const: true, required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [napalm, mutating, configuration, rollback]
