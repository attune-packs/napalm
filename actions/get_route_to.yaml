ref: napalm.get_route_to
label: "Get Routes (Read Only)"
description: "Read normalized routes for an IP prefix where the selected driver documents support"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: napalm_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, description: "Pack-owned Attune Key containing the device profile", default: "napalm.credentials", required: true}
  destination: {type: string, description: "IPv4 or IPv6 prefix", required: true}
  protocol: {type: string, description: "Optional routing protocol filter", required: false}
  longer: {type: boolean, description: "Include more-specific routes", default: false, required: false}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [napalm, read-only, routes]
