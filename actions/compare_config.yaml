ref: napalm.compare_config
label: "Compare Configuration (Transient Candidate Mutation)"
description: "Stage supplied merge or replacement text, return a redacted diff, and always discard the candidate before closing"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: napalm_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, description: "Pack-owned Attune Key containing the device profile", default: "napalm.credentials", required: true}
  config: {type: string, description: "Candidate configuration text, limited to 2 MiB", required: true}
  mode: {type: string, description: "Candidate operation", enum: [merge, replace], default: merge, required: false}
  confirm_replace: {type: boolean, description: "Required true when mode is replace; acknowledges full-replacement semantics", default: false, required: false}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [napalm, candidate-mutating, non-committing, configuration]
